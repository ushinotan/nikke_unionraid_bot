name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nikke_unionraid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nikke_unionraid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Initialize database schema
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/init.sql:/init.sql:ro \
            -e PGPASSWORD=postgres \
            postgres:16-alpine \
            psql -h localhost -U postgres -d nikke_unionraid -f /init.sql

      - name: Run Gradle tests
        working-directory: kotlin
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/nikke_unionraid
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: ./gradlew test --no-daemon

  web:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # web/Dockerfile のベースイメージと同じ Node.js バージョンでテストする
      - name: Resolve Node.js version from Dockerfile
        id: node-version
        run: |
          version=$(../scripts/web-node-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  web-docker:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 本番 (Railway) と同じ web/Dockerfile でイメージをビルドし、起動できることを確認する
      # GitHub Actions のキャッシュでレイヤーを再利用し、web 配下が変わらない PR のビルドを短縮する
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          pull: true
          load: true
          tags: web-ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Check Node.js version in image
        run: |
          expected="v$(scripts/web-node-version.sh)"
          actual=$(docker run --rm web-ci node -v)
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"

      - name: Smoke test web container
        run: |
          docker run -d --name web-ci -p 3000:3000 \
            -e SESSION_SECRET=ci-dummy-session-secret-0123456789abcdef \
            -e INTERNAL_API_TOKEN=ci-dummy-token \
            -e BACKEND_URL=http://127.0.0.1:8080 \
            web-ci

          up=false
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then
              up=true
              break
            fi
            sleep 1
          done
          if [ "$up" != true ]; then
            echo "::error::web コンテナが起動しませんでした"
            docker logs web-ci
            exit 1
          fi

          # 保護されたパスで proxy と iron-session（Cookie の復号を含む）が動くことを確認する
          # 未ログイン（Cookie なし / 不正な Cookie）は /api/auth/discord へ 307 でリダイレクトされる
          check() {
            name="$1"; expected="$2"; shift 2
            status=$(curl -s -o /dev/null -w '%{http_code}' "$@")
            echo "$name: $status (expected $expected)"
            if [ "$status" != "$expected" ]; then
              docker logs web-ci
              exit 1
            fi
          }
          check "GET /raids (no cookie)" 307 http://127.0.0.1:3000/raids
          check "GET /raids (invalid cookie)" 307 -H 'Cookie: nikke_raid_session=invalid' http://127.0.0.1:3000/raids
          check "GET /api/raids (no cookie)" 401 http://127.0.0.1:3000/api/raids
