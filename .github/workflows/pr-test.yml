name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nikke_unionraid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nikke_unionraid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Initialize database schema
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/init.sql:/init.sql:ro \
            -e PGPASSWORD=postgres \
            postgres:16-alpine \
            psql -h localhost -U postgres -d nikke_unionraid -f /init.sql

      - name: Run Gradle tests
        working-directory: kotlin
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/nikke_unionraid
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: ./gradlew test --no-daemon

  web:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # web/Dockerfile のベースイメージと同じ Node.js バージョンでテストする
      - name: Resolve Node.js version from Dockerfile
        id: node-version
        run: |
          version=$(sed -n 's/^FROM node:\([0-9][0-9.]*\)-alpine AS base$/\1/p' Dockerfile)
          if [ -z "$version" ]; then
            echo "::error file=web/Dockerfile::FROM node:<version>-alpine AS base が見つかりません"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  web-docker:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本番 (Railway) と同じ web/Dockerfile でイメージをビルドし、起動できることを確認する
      - name: Build web image
        run: docker build --pull -t web-ci ./web

      - name: Check Node.js version in image
        run: |
          expected=$(sed -n 's/^FROM node:\([0-9][0-9.]*\)-alpine AS base$/\1/p' web/Dockerfile)
          actual=$(docker run --rm web-ci node -v)
          echo "expected=v$expected actual=$actual"
          test "$actual" = "v$expected"

      - name: Smoke test web container
        run: |
          docker run -d --name web-ci -p 3000:3000 \
            -e SESSION_SECRET=ci-dummy-session-secret-0123456789abcdef \
            -e INTERNAL_API_TOKEN=ci-dummy-token \
            -e BACKEND_URL=http://127.0.0.1:8080 \
            web-ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then
              echo "web container is up"
              exit 0
            fi
            sleep 1
          done
          docker logs web-ci
          exit 1
