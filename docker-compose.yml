services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nikke_unionraid_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=jdbc:postgresql://${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-nikke_unionraid}
      - POSTGRES_DB=${POSTGRES_DB:-nikke_unionraid}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DEFAULT_TIMEZONE_HOURS=${DEFAULT_TIMEZONE_HOURS:-9}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - bot_network

  db:
    image: postgres:16-alpine
    container_name: nikke_unionraid_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nikke_unionraid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Note: schema is applied by the bot container on startup via psql (see Dockerfile)
      # We avoid bind-mounting init.sql here because in some dev setups (devcontainer + docker-outside-of-docker)
      # file bind mounts resolve as directories on the Docker host, causing "Is a directory" errors.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

volumes:
  postgres_data:
    driver: local

networks:
  bot_network:
    driver: bridge