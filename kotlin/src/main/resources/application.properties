spring.application.name=nikke-unionraid-bot
server.port=8080

# Discord
discord.token=${DISCORD_TOKEN:}
discord.dev-guild-id=${DEV_GUILD_ID:}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nikke_unionraid}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=NikkeUnionRaidHikariPool

# Timezone
app.default-timezone-hours=${DEFAULT_TIMEZONE_HOURS:9}

# 内部API認証(BFF -> Backend)。未設定の場合 /api 配下は全拒否(fail-closed)
app.internal-api-token=${INTERNAL_API_TOKEN:}
